<style>
  :root{--bg:#07101c;--panel:rgba(7,16,28,.72);--line:rgba(150,190,215,.14);--text:#eaf3f8;--muted:#8fa7b8;--chip:rgba(22,40,58,.6)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;color:var(--text);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{background:radial-gradient(ellipse 70% 55% at 0% 100%,rgba(70,150,150,.42),transparent 70%),radial-gradient(ellipse 60% 45% at 100% 0%,rgba(40,70,120,.28),transparent 70%),linear-gradient(180deg,#050a14 0%,#0a1726 45%,#0f2a36 80%,#15404a 100%);background-attachment:fixed}
  header{padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header h1{font-family:"Jost",sans-serif;font-size:30px;margin:0 0 6px;font-weight:300;letter-spacing:.42em;text-transform:uppercase;text-shadow:0 0 18px rgba(170,230,255,.45)}
  header p{margin:0;color:var(--muted);font-size:13.5px;max-width:720px;line-height:1.5}
  .hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;margin-left:auto}
  .search{position:relative;width:300px;max-width:100%}
  .search input{font-family:inherit;width:100%;background:rgba(9,20,34,.92);border:1px solid rgba(150,190,215,.22);border-radius:10px;color:var(--text);font-size:14px;padding:9px 12px 9px 34px;outline:none}
  .search input:focus{border-color:#4b6fa8;box-shadow:0 0 0 3px rgba(61,184,255,.15)}
  .search .sicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;border:2px solid var(--muted);border-radius:50%;pointer-events:none}
  .search .sicon:after{content:'';position:absolute;width:6px;height:2px;background:var(--muted);right:-6px;bottom:-3px;transform:rotate(45deg)}
  .results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:rgba(9,20,34,.92);border:1px solid rgba(150,190,215,.22);border-radius:10px;padding:6px;z-index:20;max-height:360px;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .results[hidden]{display:none}
  .res{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer}
  .res.active,.res:hover{background:rgba(60,110,140,.22)}
  .res b{display:block;font-size:13.5px;font-weight:600}
  .res small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-top:1px}
  .res mark{background:none;color:#7fd0ff}
  .noresult{padding:10px;color:var(--muted);font-size:13px}
  .chip.hit{border-color:#7fd0ff;box-shadow:0 0 0 2px rgba(127,208,255,.25)}
  @keyframes pulse{0%{opacity:1}100%{opacity:.15}}
  .pulse{animation:pulse 1.1s ease-in-out infinite alternate}
  .legend{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  body{display:flex;flex-direction:column;height:100vh}
  header{flex:none}
  .wrap{display:flex;flex:1;min-height:520px}
  .stage{flex:1;position:relative;min-width:0;overflow:hidden}
  svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
  svg.dragging{cursor:grabbing}
  .controls{position:absolute;left:14px;bottom:14px;display:flex;gap:8px}
  .btn{font-family:inherit;background:rgba(14,30,46,.8);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:rgba(150,200,230,.4)}
  .hint .mob{display:none}
  .hint{position:absolute;right:14px;top:12px;font-size:12px;color:var(--muted);pointer-events:none}
  .panel{width:370px;flex:none;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-left:1px solid var(--line);overflow-y:auto;padding:20px 20px 28px}
  .panel h2{font-family:"Jost",sans-serif;font-size:22px;margin:6px 0 8px;font-weight:400;letter-spacing:.04em}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  .panel p{color:#c4d4de;font-size:14.5px;font-weight:300;line-height:1.65;margin:0 0 14px}
  .sec{margin-top:18px}
  .sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:0 0 8px;font-weight:600}
  .link{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .link:hover{background:var(--chip);border-color:var(--line)}
  .link .dot{margin-top:6px}
  .link b{display:block;font-size:14px;font-weight:600}
  .link small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 4px;font-size:12.5px;color:var(--text);text-decoration:none}
  a.chip:hover{border-color:rgba(150,200,230,.4);background:rgba(60,110,140,.28)}
  .logo{width:22px;height:22px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font-size:9.5px;font-weight:700;color:#0c0f16}
  .logo img{width:16px;height:16px;object-fit:contain}
  .ext{opacity:.5;font-size:11px}
  .sat a:hover text.lbl{text-decoration:underline}
  .group{margin-bottom:10px}
  .foot{margin-top:22px;font-size:11.5px;color:#6f8798;line-height:1.5}
  .edge-base{fill:none;stroke-width:1.4;opacity:.28;transition:opacity .35s}
  .edge-flow{fill:none;stroke-width:2;opacity:.55;stroke-dasharray:2 10;animation:flow 1.4s linear infinite;transition:opacity .35s}
  @keyframes flow{to{stroke-dashoffset:-24}}
  .node{cursor:pointer;transition:opacity .35s;outline:none}
  .node:focus-visible .ring{stroke-opacity:1;stroke-width:2}
  .node text{font-size:15px;font-weight:400;letter-spacing:.02em;fill:#e6f0f6;text-anchor:middle;paint-order:stroke;stroke:#08121f;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
  .node:hover .ring{stroke-opacity:1}
  .deco{transition:opacity .35s}
  .ring{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{stroke-opacity:.3}50%{stroke-opacity:.85}}
  .twinkle{animation:twinkle var(--tw,4s) ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.95}}

  .dim{opacity:.08!important}
  .hl.edge-base{opacity:.75;stroke-width:2.2}
  .hl.edge-flow{opacity:1;stroke-width:2.6}
  .sat text{fill:#eef6fa;paint-order:stroke;stroke:#08121f;stroke-linejoin:round}
  .sat{animation:fadein .4s ease both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @media (max-width:860px){
    body{height:auto}
    .wrap{flex-direction:column;height:auto}
    header h1{font-size:22px;letter-spacing:.3em}
    .stage{flex:none;height:64vh;min-height:380px}
    .panel{width:auto;border-left:0;border-top:1px solid var(--line)}
    .hint{left:12px;right:auto;top:10px;font-size:11.5px;background:rgba(7,16,28,.6);padding:4px 10px;border-radius:999px;transition:opacity .6s}
    .hint .desk{display:none}
    .hint .mob{display:inline}
    .node text{font-size:23px}
    svg.focused .node text{font-size:15px}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>The AI Universe</h1>
    <p>From sand and electricity to the chatbot on your phone. Tap any node to zoom in and see what flows into it, what it supplies, and who the key players are.</p>
  </div>
  <div class="hdr-right">
    <div class="search">
      <span class="sicon"></span>
      <input id="q" type="search" placeholder="Search companies…" autocomplete="off" aria-label="Search companies" aria-controls="results">
      <div class="results" id="results" role="listbox" hidden></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</header>
<div class="wrap">
  <div class="stage">
    <svg id="svg" viewBox="0 0 1600 960" preserveAspectRatio="xMidYMid meet" aria-label="Network map of the AI ecosystem">
      <defs>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="starglow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="1.6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="gBg"></g><g id="gDeco"></g><g id="gEdges"></g><g id="gNodes"></g><g id="gSat"></g>
    </svg>
    <div class="controls">
      <button class="btn" id="resetBtn">Full network</button>
    </div>
    <div class="hint" id="hint"><span class="desk">Drag to pan · scroll to zoom · / to search · Esc to reset</span><span class="mob">Drag to explore · pinch to zoom · tap a node</span></div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>

<script>
const LAYERS = {
  supply:  {name:'Semiconductor Supply Chain', c:'#ff8a62'},
  chips:   {name:'Chips & Hardware',           c:'#ffd47a'},
  infra:   {name:'Physical Infrastructure',    c:'#4fe3c6'},
  compute: {name:'Compute Providers',          c:'#62c9ff'},
  ai:      {name:'Models & Data',              c:'#b8a2ff'},
  demand:  {name:'Applications & Demand',      c:'#ff86c8'},
  capital: {name:'Capital',                    c:'#e3edf5'}
};

const SITES = {
"Intel (Gaudi)": "https://www.intel.com/content/www/us/en/products/details/processors/ai-accelerators/gaudi.html",
"Microsoft Maia": "https://azure.microsoft.com/",

"Microsoft Copilot": "https://copilot.microsoft.com/",

"SoftBank": "https://group.softbank/en",
"Blackstone": "https://www.blackstone.com/",
"Brookfield": "https://www.brookfield.com/",
"MGX": "https://www.mgx.ae/"
};
const urlOf = p => SITES[p] || null;
const logoSrc = u => `https://www.google.com/s2/favicons?domain=${new URL(u).hostname}&sz=64`;
const initials = p => p.replace(/\(.*?\)/g, '').trim().split(/[\s\/-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
function chipHTML(p, hit) {
  const u = urlOf(p), ini = initials(p);
  const logo = u
    ? `<span class="logo"><img src="${logoSrc(u)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${ini}'"></span>`
    : `<span class="logo">${ini}</span>`;
  return u
    ? `<a class="chip${hit ? ' hit' : ''}" href="${u}" target="_blank" rel="noopener" title="Visit the ${esc(p)} website">${logo}${esc(p)}<span class="ext">↗</span></a>`
    : `<span class="chip${hit ? ' hit' : ''}">${logo}${esc(p)}</span>`;
}

const NODES = [
  {id:'materials', name:'Materials & Wafers', layer:'supply', x:110, y:470,
   desc:'The physical starting point. Ultra-pure silicon wafers, specialty gases (neon, fluorine compounds), photoresists and chemicals that fabs consume in enormous volumes.',
   players:['Shin-Etsu','SUMCO','GlobalWafers','Siltronic','JSR','Linde','Air Liquide']},
  {id:'eda', name:'Chip IP & EDA', layer:'supply', x:270, y:170,
   desc:'Design software and licensable building blocks. Every AI chip is designed and verified with EDA tools, and many use licensed CPU cores and interface IP.',
   players:['Synopsys','Cadence','Siemens EDA','Arm','Alphawave']},
  {id:'equipment', name:'Fab Equipment', layer:'supply', x:270, y:720,
   desc:'The machines that make chips: lithography, etch, deposition and inspection tools. ASML is the only supplier of EUV lithography, a key chokepoint.',
   players:['ASML','Applied Materials','Lam Research','Tokyo Electron','KLA']},
  {id:'gpus', name:'GPU Makers', layer:'chips', x:470, y:275,
   desc:'Merchant chip companies that design GPUs and AI accelerators and sell them to anyone: clouds, labs, enterprises and governments. Nvidia dominates, helped by its CUDA software ecosystem.',
   players:['Nvidia','AMD','Intel (Gaudi)','Cerebras']},
  {id:'custom', name:'Custom Chips', layer:'chips', x:610, y:130,
   desc:'Chips built for one cloud company\'s own data centers. The big clouds design them in-house, often with Broadcom or Marvell as design partners, to cut costs and depend less on Nvidia.',
   players:['Google TPU','AWS Trainium','Microsoft Maia','Meta MTIA','Broadcom','Marvell']},
  {id:'foundry', name:'Foundries', layer:'chips', x:470, y:500,
   desc:'Fabs that manufacture logic chips on leading-edge nodes. TSMC makes the vast majority of advanced AI accelerators.',
   players:['TSMC','Samsung Foundry','Intel Foundry']},
  {id:'memory', name:'HBM Memory', layer:'chips', x:520, y:760,
   desc:'High-bandwidth memory: stacked DRAM placed right next to the GPU. Training large models is often limited by memory bandwidth, making HBM one of the tightest bottlenecks.',
   players:['SK hynix','Samsung','Micron']},
  {id:'packaging', name:'Advanced Packaging', layer:'chips', x:690, y:620,
   desc:'Joins the logic die and HBM stacks on one interposer (for example TSMC CoWoS). Packaging capacity has repeatedly capped how many AI GPUs can ship.',
   players:['TSMC (CoWoS)','ASE','Amkor','Intel (Foveros)']},
  {id:'networking', name:'Networking & Optics', layer:'chips', x:720, y:300,
   desc:'Thousands of GPUs must behave like one computer. Switches, network cards and optical transceivers connect them inside racks and across buildings.',
   players:['Nvidia (InfiniBand, Spectrum-X)','Broadcom','Arista','Cisco','Coherent','Lumentum','InnoLight']},
  {id:'servers', name:'Servers & Racks', layer:'chips', x:880, y:470,
   desc:'Contract manufacturers and OEMs that assemble chips, boards, power and cooling into full AI racks shipped to data centers.',
   players:['Foxconn','Quanta','Wistron / Wiwynn','Supermicro','Dell','HPE']},
  {id:'energy', name:'Energy & Grid', layer:'infra', x:660, y:880,
   desc:'Electricity is now a binding constraint. Large AI campuses need hundreds of megawatts to gigawatts, driving deals for nuclear, gas and renewables, and long grid-connection queues.',
   players:['NextEra','Constellation','Vistra','GE Vernova','Siemens Energy','Oklo','Grid operators (PJM, ERCOT)']},
  {id:'powercool', name:'Power & Cooling', layer:'infra', x:900, y:800,
   desc:'Equipment inside the data center: transformers, switchgear, UPS systems and the liquid cooling that dense GPU racks now require.',
   players:['Vertiv','Schneider Electric','Eaton','ABB','Trane']},
  {id:'dcbuild', name:'Data Center Builders', layer:'infra', x:1060, y:680,
   desc:'Developers and colocation operators that secure land and power, build the shells, and lease capacity (measured in MW) to cloud providers.',
   players:['Equinix','Digital Realty','QTS (Blackstone)','Vantage','NTT','AdaniConneX','Yotta']},
  {id:'hyperscalers', name:'Hyperscalers', layer:'compute', x:1100, y:430,
   desc:'The giant clouds. They buy most AI chips, run their own and leased data centers, rent compute to labs and enterprises, and design in-house chips.',
   players:['AWS','Microsoft Azure','Google Cloud','Oracle OCI','Meta (own use)']},
  {id:'neoclouds', name:'GPU Clouds', layer:'compute', x:1040, y:190,
   desc:'Specialist "neoclouds" built purely around renting GPUs, often financed with debt secured against the chips themselves.',
   players:['CoreWeave','Nebius','Lambda','Crusoe','Together AI']},

const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const gDeco = document.getElementById('gDeco');
const decoOf = {}, ORBITS = [];
NODES.forEach(n => {
  const g = el('g', {class:'deco'}, gDeco);
  decoOf[n.id] = g;
  const rings = [[38, 58, 3 + Math.floor(rand()*2)], [62, 88, 4 + Math.floor(rand()*3)]];
  const flip = rand() < .5;
  rings.forEach(([r0, r1, count], ri) => {
    const og = el('g', {class:'orbit'}, g);
    const period = ri === 0 ? 26 + rand()*14 : 45 + rand()*25;
    ORBITS.push({g:og, cx:n.x, cy:n.y, speed:(360/period) * ((ri === 0) !== flip ? -1 : 1), phase:rand()*360});
    const start = rand()*Math.PI*2, pts = [];
    for (let i = 0; i < count; i++) {
      const a = start + i*(Math.PI*2/count) + (rand() - .5)*.9, r = r0 + rand()*(r1 - r0);
      pts.push([n.x + Math.cos(a)*r, n.y + Math.sin(a)*r]);
    }
    pts.forEach((p, i) => {
      el('line', {x1:n.x, y1:n.y, x2:p[0], y2:p[1], stroke:col(n), 'stroke-width':.5, opacity:.22}, og);
      const q = pts[(i+1) % pts.length];
      el('line', {x1:p[0], y1:p[1], x2:q[0], y2:q[1], stroke:col(n), 'stroke-width':.5, opacity:.14}, og);
      el('circle', {cx:p[0], cy:p[1], r:1.5 + rand()*2.2, fill:col(n), opacity:.6}, og);
    });
  });
});

(function spin(now) {
  const t = now / 1000;
  for (const o of ORBITS) o.g.setAttribute('transform', `rotate(${((o.phase + t*o.speed) % 360).toFixed(2)} ${o.cx} ${o.cy})`);
  requestAnimationFrame(spin);
})(performance.now());

const gEdges = document.getElementById('gEdges');

  const cx = (A.x + B.x)/2 - dy/len * len*.14, cy = (A.y + B.y)/2 + dx/len * len*.14;
  const d = `M${A.x},${A.y} Q${cx},${cy} ${B.x},${B.y}`;
  const base = el('path', {d, class:'edge-base', stroke: col(A)}, gEdges);
  const flow = el('path', {d, class:'edge-flow', stroke: col(A)}, gEdges);
  return {a, b, label, base, flow};
});

let vb = {x:0, y:0, w:W, h:H}, anim = null, current = null;
const setVB = v => { vb = v; svg.setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`); };
function animateTo(target, done) {
  cancelAnimationFrame(anim);
  const from = {...vb}, t0 = performance.now(), dur = 650;
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
  const step = now => {
    const t = Math.min(1, (now - t0)/dur), k = ease(t);
    setVB({x: from.x + (target.x-from.x)*k, y: from.y + (target.y-from.y)*k, w: from.w + (target.w-from.w)*k, h: from.h + (target.h-from.h)*k});
    if (t < 1) anim = requestAnimationFrame(step); else if (done) done();
  };
  anim = requestAnimationFrame(step);
}
const pxToWorld = () => Math.max(vb.w / svg.clientWidth, vb.h / svg.clientHeight);

const gSat = document.getElementById('gSat');

function drawPlayers(n, hl) {
  gSat.innerHTML = '';

    const right = Math.cos(a) > .2, left = Math.cos(a) < -.2;

      'text-anchor': right ? 'start' : left ? 'end' : 'middle', 'font-size': 12.5*s, 'stroke-width': 3*s}, h);

function focusNode(id, hl) {
  const n = byId[id]; current = id; currentHl = hl || null;
  svg.classList.add('focused');
  const nb = new Set([id]);
  edgeEls.forEach(e => { if (e.a === id) nb.add(e.b); if (e.b === id) nb.add(e.a); });
  NODES.forEach(m => { nodeEls[m.id].classList.toggle('dim', !nb.has(m.id)); decoOf[m.id].classList.toggle('dim', m.id !== id); });
  edgeEls.forEach(e => {
    const on = e.a === id || e.b === id;
    [e.base, e.flow].forEach(p => { p.classList.toggle('dim', !on); p.classList.toggle('hl', on); });
  });
  const xs = [...nb].map(k => byId[k].x), ys = [...nb].map(k => byId[k].y), pad = 130;
  let x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const aspect = svg.clientWidth / svg.clientHeight;
  let w = Math.max(x1 - x0, 420), h = Math.max(y1 - y0, 320);
  if (w / h < aspect) w = h * aspect; else h = w / aspect;
  const maxW = Math.min(760, Math.max(380, svg.clientWidth * 0.75));
  if (w > maxW) { h *= maxW / w; w = maxW; }
  const cx = n.x, cy = n.y;
  gSat.innerHTML = '';
  document.querySelectorAll('.node text').forEach(t => t.style.opacity = '');
  animateTo({x: cx - w/2, y: cy - h/2, w, h}, () => drawPlayers(n, currentHl));
  if (window.innerWidth <= 860) { const st = document.querySelector('.stage').getBoundingClientRect(); if (st.top < 0 || st.bottom > window.innerHeight) document.querySelector('.stage').scrollIntoView({behavior:'smooth', block:'start'}); }
  renderPanel(n, currentHl);
}

function homeView() {
  const cw = svg.clientWidth, ch = svg.clientHeight;
  if (cw > 600) return {x:0, y:0, w:W, h:H};
  const w = Math.min(W, cw * 2.3), h = w * ch / cw;
  return {x: W/2 - w/2 - 40, y: H/2 - h/2 + 20, w, h};
}
function reset() {
  current = null; currentHl = null; gSat.innerHTML = '';
  svg.classList.remove('focused');
  document.querySelectorAll('.node text').forEach(t => t.style.opacity = '');
  document.querySelectorAll('.dim,.hl').forEach(e => e.classList.remove('dim', 'hl'));
  animateTo(homeView());
  renderOverview();
}

const panel = document.getElementById('panel');

function bindLinks() { panel.querySelectorAll('.link').forEach(l => l.onclick = () => focusNode(l.dataset.id)); }

let drag = null, moved = false, pinch = null;
const pts = new Map();
function toWorld(cx, cy, v) {
  const r = svg.getBoundingClientRect(), sc = Math.max(v.w / r.width, v.h / r.height);
  const ox = (r.width - v.w/sc)/2, oy = (r.height - v.h/sc)/2;
  return {x: v.x + (cx - r.left - ox)*sc, y: v.y + (cy - r.top - oy)*sc};
}
function pinchInfo() {
  const [a, b] = [...pts.values()];
  return {d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x)/2, my: (a.y + b.y)/2};
}
svg.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pts.size === 1) { drag = {x:e.clientX, y:e.clientY, vb:{...vb}}; moved = false; }
  else if (pts.size === 2) {
    const i = pinchInfo(); drag = null; moved = true; cancelAnimationFrame(anim);
    pinch = {d0: i.d, vb0: {...vb}, P: toWorld(i.mx, i.my, vb)};
  }
});
window.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && pts.size >= 2) {
    const i = pinchInfo(), v0 = pinch.vb0;
    const w = Math.min(W*1.6, Math.max(160, v0.w * pinch.d0 / i.d)), h = v0.h * w / v0.w;
    const r = svg.getBoundingClientRect(), sc = Math.max(w / r.width, h / r.height);
    const ox = (r.width - w/sc)/2, oy = (r.height - h/sc)/2;
    setVB({x: pinch.P.x - (i.mx - r.left - ox)*sc, y: pinch.P.y - (i.my - r.top - oy)*sc, w, h});
    if (current) drawPlayers(byId[current], currentHl);
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 5) return;
  moved = true; svg.classList.add('dragging');
  const sc = Math.max(drag.vb.w / svg.clientWidth, drag.vb.h / svg.clientHeight);
  cancelAnimationFrame(anim);
  setVB({...drag.vb, x: drag.vb.x - dx*sc, y: drag.vb.y - dy*sc});
});
function endPointer(e) {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (pts.size === 1) { const [p] = [...pts.values()]; drag = {x:p.x, y:p.y, vb:{...vb}}; }
  if (pts.size === 0) { drag = null; svg.classList.remove('dragging'); setTimeout(() => moved = false, 0); }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
svg.addEventListener('click', () => { if (!moved && current) reset(); });
svg.addEventListener('wheel', e => {
  e.preventDefault(); cancelAnimationFrame(anim);
  const r = svg.getBoundingClientRect(), s = pxToWorld();
  const ox = (r.width - vb.w/s)/2, oy = (r.height - vb.h/s)/2;
  const wx = vb.x + (e.clientX - r.left - ox)*s, wy = vb.y + (e.clientY - r.top - oy)*s;
  const f = Math.exp(e.deltaY * .0015), nw = Math.min(W*1.6, Math.max(220, vb.w*f)), k = nw / vb.w;
  setVB({x: wx - (wx - vb.x)*k, y: wy - (wy - vb.y)*k, w: nw, h: vb.h*k});
  if (current) drawPlayers(byId[current], currentHl);
}, {passive:false});
document.getElementById('resetBtn').onclick = reset;
window.addEventListener('keydown', e => { if (e.key === 'Escape') reset(); });
window.addEventListener('resize', () => { if (current) focusNode(current, currentHl); else setVB(homeView()); });

const q = document.getElementById('q'), results = document.getElementById('results');
const INDEX = [];
NODES.forEach(n => {
  INDEX.push({label:n.name, node:n, kind:'node'});
  n.players.forEach(p => INDEX.push({label:p, node:n, kind:'player'}));
});
let hits = [], active = 0;
const norm = t => t.toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]/g, ' ');
const mark = (t, term) => {
  const i = t.toLowerCase().indexOf(term);
  return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + term.length)) + '</mark>' + esc(t.slice(i + term.length));
};
function search() {
  const term = q.value.trim().toLowerCase();
  if (!term) { results.hidden = true; return; }
  const nt = norm(term).trim();
  hits = INDEX.map(it => {
    const l = it.label.toLowerCase(), nl = norm(it.label);
    let score = l.startsWith(term) ? 0 : nl.split(/\s+/).some(w => w.startsWith(nt)) ? 1 : (l.includes(term) || nl.includes(nt)) ? 2 : -1;
    return {...it, score};
  }).filter(h => h.score >= 0).sort((a, b) => a.score - b.score || (a.kind === b.kind ? 0 : a.kind === 'player' ? -1 : 1) || a.label.length - b.label.length || a.label.localeCompare(b.label)).slice(0, 12);
  active = 0;
  results.innerHTML = hits.length ? hits.map((h, i) => {
    const icon = h.kind === 'player' ? chipLogo(h.label) : `<span class="logo" style="background:${col(h.node)}"></span>`;
    const sub = h.kind === 'player'
      ? `<i class="dot" style="background:${col(h.node)}"></i>in ${esc(h.node.name)}`
      : `<i class="dot" style="background:${col(h.node)}"></i>${esc(LAYERS[h.node.layer].name)}`;
    return `<div class="res${i === 0 ? ' active' : ''}" role="option" data-i="${i}">${icon}<div><b>${mark(h.label, term)}</b><small>${sub}</small></div></div>`;
  }).join('') : '<div class="noresult">No matches in the network</div>';
  results.hidden = false;
  results.querySelectorAll('.res').forEach(r => {
    r.onmousedown = e => { e.preventDefault(); pick(+r.dataset.i); };
  });
}
function chipLogo(p) {
  const u = urlOf(p), ini = initials(p);
  return u ? `<span class="logo"><img src="${logoSrc(u)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${ini}'"></span>` : `<span class="logo">${ini}</span>`;
}
function pick(i) {
  const h = hits[i]; if (!h) return;
  results.hidden = true; q.value = h.label; q.blur();
  focusNode(h.node.id, h.kind === 'player' ? h.label : null);
}
function setActive(i) {
  const rows = results.querySelectorAll('.res'); if (!rows.length) return;
  active = (i + rows.length) % rows.length;
  rows.forEach((r, k) => r.classList.toggle('active', k === active));
  rows[active].scrollIntoView({block:'nearest'});
}
q.addEventListener('input', search);
q.addEventListener('focus', () => { if (q.value.trim()) search(); });
q.addEventListener('blur', () => setTimeout(() => results.hidden = true, 120));
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); pick(active); }
  else if (e.key === 'Escape') { e.stopPropagation(); if (!results.hidden) results.hidden = true; else { q.value = ''; q.blur(); } }
});
window.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});

renderOverview();
setVB(homeView());
setTimeout(() => { const h = document.getElementById('hint'); if (h && window.innerWidth <= 860) h.style.opacity = 0; }, 6000);
</script>
</body>
</html>
